<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lector QR iPod Touch 5G</title>
    <!-- Librería ligera para decodificar QR basada en JS puro -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            font-size: 20px;
            margin-top: 0;
        }
        p {
            font-size: 14px;
            color: #636366;
        }
        .btn-capture {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-capture:active {
            background-color: #0056b3;
        }
        #file-input {
            display: none;
        }
        #result-container {
            margin-top: 20px;
            padding: 12px;
            background: #e5e5ea;
            border-radius: 8px;
            word-break: break-all;
            display: none;
        }
        #result-link {
            color: #007aff;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin-top: 8px;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Lector QR para iPod Touch</h2>
    <p>Toca el botón para abrir la cámara, fotografiar un código QR y leerlo al instante.</p>

    <!-- El atributo accept="image/*" y capture="environment" forzarán la apertura de la cámara trasera -->
    <button class="btn-capture" onclick="document.getElementById('file-input').click();">Escanear con Cámara</button>
    <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleImage(this)">

    <div id="result-container">
        <strong>Resultado:</strong>
        <p id="result-text"></p>
        <a id="result-link" href="#" target="_blank" style="display:none;">Abrir Enlace</a>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
function handleImage(input) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function (e) {
            var img = new Image();
            img.onload = function () {
                var canvas = document.getElementById('canvas');
                var ctx = canvas.getContext('2d');
                
                // Redimensionar si la imagen es muy grande para optimizar procesamiento en el iPod
                var maxDimension = 800;
                var width = img.width;
                var height = img.height;
                
                if (width > height && width > maxDimension) {
                    height *= maxDimension / width;
                    width = maxDimension;
                } else if (height > maxDimension) {
                    width *= maxDimension / height;
                    height = maxDimension;
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                var code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });
                
                var resultContainer = document.getElementById('result-container');
                var resultText = document.getElementById('result-text');
                var resultLink = document.getElementById('result-link');
                
                resultContainer.style.display = 'block';
                
                if (code) {
                    resultText.innerText = code.data;
                    
                    // Comprobar si el texto decodificado es una URL válida
                    if (code.data.startsWith('http://') || code.data.startsWith('https://')) {
                        resultLink.href = code.data;
                        resultLink.style.display = 'block';
                        resultLink.innerText = "Abrir Enlace: " + code.data;
                    } else {
                        resultLink.style.display = 'none';
                    }
                } else {
                    resultText.innerText = "No se pudo detectar ningún código QR. Inténtá de nuevo asegurándote de enfocar bien.";
                    resultLink.style.display = 'none';
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>

</body>
</html>
